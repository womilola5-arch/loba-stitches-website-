<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>loba stitches — handcrafted crochet fashion</title>
<link href="https://fonts.googleapis.com/css2?family=cormorant+garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=syne:wght@400;600;700;800&family=dm+sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0f0906;
  --deep:#1a0f0a;
  --brown:#2e1a10;
  --warm:#4a2510;
  --caramel:#c47c3e;
  --gold:#d4a547;
  --gold2:#e8c070;
  --sand:#e8c99a;
  --cream:#f5e6d3;
  --off:#fdf8f2;
  --muted:#8a6a55;
  --text:#1e0e06;
  --tz: 185px; /* responsive 3d transform depth z */
}
html{scroll-behavior:smooth;}
body{font-family:'dm sans',sans-serif;background:var(--ink);color:var(--cream);overflow-x:hidden;cursor:none;}

/* ── cursor ── */
#dot{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;}
#ring{position:fixed;width:30px;height:30px;border:1px solid rgba(212,165,71,.6);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .08s ease-out,top .08s ease-out,width .3s ease,height .3s ease,background .3s ease,border-color .3s ease;}
#ring.hovering{width:54px;height:54px;background:rgba(212,165,71,.12);border-color:var(--gold2);}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(10,6,3,.9);backdrop-filter:blur(24px);border-bottom:1px solid rgba(212,165,71,.1);animation:slided .8s ease both;}
.logo{display:flex;align-items:baseline;gap:.3rem;text-decoration:none;}
.logo-b{font-family:'syne',sans-serif;font-size:1.55rem;font-weight:800;color:var(--cream);letter-spacing:.06em;}
.logo-s{font-family:'dm sans',sans-serif;font-size:.72rem;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
.navlinks{display:flex;gap:2.2rem;}
.nl{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:none;text-decoration:none;position:relative;transition:color .3s;}
.nl::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s;}
.nl:hover{color:var(--gold);}.nl:hover::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:1rem;}
.nav-admin{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:none;transition:all .3s;border:1px solid rgba(212,165,71,.2);padding:.45rem .9rem;}
.nav-admin:hover{color:var(--gold);border-color:var(--gold);background:rgba(212,165,71,.05);}
.nav-cta{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:.55rem 1.4rem;cursor:none;font-weight:700;transition:all .3s;text-decoration:none;}
.nav-cta:hover{background:var(--cream);}

/* ── hero ── */
#hero{min-height:100vh;background:var(--ink);display:grid;grid-template-columns:1.1fr 0.9fr;align-items:center;padding:7rem 3rem 4rem;gap:2rem;position:relative;overflow:hidden;}

.glow-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:orbfloat 8s ease-in-out infinite;}
.orb1{width:420px;height:420px;background:radial-gradient(circle,rgba(196,124,62,.22),transparent 70%);top:10%;left:55%;animation-delay:0s;}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(212,165,71,.12),transparent 70%);bottom:15%;left:5%;animation-delay:3s;}
@keyframes orbfloat{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-20px);}}

#hero::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3csvg viewbox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='n'%3e%3cfeturbulence type='fractalnoise' basefrequency='.85' numoctaves='4' stitchtiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3e%3c/svg%3e");opacity:.5;pointer-events:none;z-index:0;}

.hl{position:relative;z-index:10;animation:fadel 1s ease .4s both;}
.hl-eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.58rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;opacity:.85;}
.hl-eyebrow::before{content:'';width:18px;height:1px;background:var(--gold);}

h1{font-family:'cormorant garamond',serif;font-size:clamp(3.2rem,5.2vw,5.6rem);font-weight:300;line-height:1.02;color:var(--cream);margin-bottom:1.3rem;letter-spacing:-.01em;}
h1 strong{font-weight:600;display:block;}
h1 em{font-style:italic;color:var(--gold);}

.hl-desc{font-size:.88rem;line-height:1.9;color:rgba(245,230,211,.5);max-width:390px;margin-bottom:2rem;}

.preorder-badge{display:inline-flex;align-items:center;gap:.6rem;background:rgba(212,165,71,.12);border:1px solid rgba(212,165,71,.3);padding:.5rem 1rem;margin-bottom:2rem;}
.pb-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.7);opacity:.5;}}
.pb-txt{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}

.pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:2.2rem;}
.pill{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,201,154,.7);border:1px solid rgba(232,201,154,.15);padding:.28rem .75rem;transition:all .3s;cursor:none;}
.pill:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}

.h-ctas{display:flex;align-items:center;gap:1.8rem;}
.btn-main{display:inline-flex;align-items:center;gap:.6rem;background:var(--gold);color:var(--ink);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:.9rem 1.9rem;cursor:none;position:relative;overflow:hidden;transition:all .3s;text-decoration:none;}
.btn-main::after{content:'';position:absolute;inset:0;background:var(--cream);transform:translatex(-101%);transition:transform .4s ease;}
.btn-main:hover::after{transform:translatex(0);}
.btn-main span{position:relative;z-index:1;color:var(--ink);transition:color .3s;}
.btn-main:hover span{color:var(--ink);}
.btn-ghost{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,230,211,.45);cursor:none;display:flex;align-items:center;gap:.4rem;text-decoration:none;transition:color .3s;}
.btn-ghost:hover{color:var(--gold);}
.btn-ghost .arr{transition:transform .3s;}
.btn-ghost:hover .arr{transform:translatex(5px);}

/* ── hero right (3d scene) ── */
.hr{position:relative;z-index:10;height:580px;animation:fader 1s ease .5s both;display:flex;align-items:center;justify-content:center;}
.scene3d{position:relative;width:100%;height:100%;perspective:1600px;display:flex;align-items:center;justify-content:center;}

.cring{position:absolute;width:0;height:0;transform-style:preserve-3d;animation:spinr 26s linear infinite;}
@keyframes spinr{from{transform:rotatey(0deg);}to{transform:rotatey(360deg);}}

.rcard{
  position:absolute;width:190px;height:245px;
  top:-122px;left:-95px;
  border-radius:18px;overflow:hidden;
  box-shadow:0 35px 90px rgba(0,0,0,.7),0 0 0 1px rgba(245,230,211,.12);
  transform-style:preserve-3d;
  transition:box-shadow .4s, border-color .4s;
}
.rcard:hover{box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 0 1px rgba(212,165,71,.5);}
.rf{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:1.1rem;position:relative;overflow:hidden;}
.rf::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3csvg width='24' height='24' viewbox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3e%3cg fill='none' stroke='rgba(255,255,255,0.08)' stroke-width='.9'%3e%3cellipse cx='6' cy='6' rx='4' ry='2.4'/%3e%3cellipse cx='18' cy='6' rx='4' ry='2.4'/%3e%3cellipse cx='6' cy='18' rx='4' ry='2.4'/%3e%3cellipse cx='18' cy='18' rx='4' ry='2.4'/%3e%3cellipse cx='12' cy='12' rx='4' ry='2.4'/%3e%3c/g%3e%3c/svg%3e");z-index:1;}
.rf::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.1) 40%,rgba(0,0,0,.85));z-index:2;}

.rf-photo{background-size:cover;background-position:center;padding:0;}
.rf-photo .rf-name{position:absolute;bottom:2.2rem;left:0;right:0;text-align:center;z-index:3;font-size:.85rem;text-shadow:0 2px 4px rgba(0,0,0,0.8);}
.rf-photo .rf-badge{position:absolute;bottom:1.1rem;left:50%;transform:translatex(-50%);z-index:3;white-space:nowrap;}
.rf-name{font-family:'cormorant garamond',serif;font-size:.88rem;font-weight:600;font-style:italic;color:rgba(255,255,255,.96);text-align:center;position:relative;line-height:1.3;}
.rf-badge{font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.25);padding:.2rem .5rem;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);}

/* centre brand anchor */
.cbrand{position:absolute;text-align:center;z-index:20;pointer-events:none;}
.cbrand-big{font-family:'syne',sans-serif;font-size:clamp(2.4rem,4.5vw,3.8rem);font-weight:800;color:var(--cream);letter-spacing:.14em;text-shadow:0 0 60px rgba(212,165,71,.5),0 4px 30px rgba(0,0,0,.6);}
.cbrand-big span{color:var(--gold);}
.cbrand-sm{font-family:'cormorant garamond',serif;font-style:italic;font-size:.9rem;color:rgba(245,230,211,.5);letter-spacing:.18em;margin-top:.3rem;}

/* needle decorations */
.ndl{position:absolute;z-index:15;pointer-events:none;opacity:.75;}
.n1{top:12%;left:-5%;transform:rotate(-28deg);}
.n2{top:15%;right:-5%;transform:rotate(28deg);}
.n3{bottom:15%;left:-3%;transform:rotate(34deg);}
.n4{bottom:12%;right:-3%;transform:rotate(-34deg);}

.fdot{position:absolute;border-radius:50%;z-index:12;pointer-events:none;animation:flt 5s ease-in-out infinite;}
@keyframes flt{0%,100%{transform:translatey(0) scale(1);}50%{transform:translatey(-14px) scale(1.08);}}

.scroll-ind{position:absolute;bottom:0.2rem;left:50%;transform:translatex(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;}
.scroll-line{width:1px;height:32px;background:linear-gradient(to bottom,var(--gold),transparent);animation:lineslide 2.2s ease-in-out infinite;}
@keyframes lineslide{0%{transform:translatey(-8px);opacity:0;}40%{opacity:1;}100%{transform:translatey(8px);opacity:0;}}
.scroll-txt{font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,230,211,.35);}

/* ── marquee ── */
.mq{background:var(--gold);overflow:hidden;padding:.65rem 0;position:relative;z-index:20;}
.mq-track{display:flex;gap:2.5rem;width:max-content;animation:mqan 24s linear infinite;}
@keyframes mqan{from{transform:translatex(0);}to{transform:translatex(-50%);}}
.mq-i{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:.9rem;}
.mq-i::after{content:'✦';font-size:.42rem;opacity:.5;}

/* ── section base ── */
.sec-hd{margin-bottom:3rem;}
.sec-tag{font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.sec-t{font-family:'syne',sans-serif;font-size:2.2rem;font-weight:700;}
.sec-t em{font-family:'cormorant garamond',serif;font-style:italic;font-weight:400;}

/* ── collection ── */
#collection{padding:6rem 3rem;background:var(--off);}
.cgrid, #dynamic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;}
#dynamic-grid{margin-top:1.4rem;}
.cc{background:#fff;cursor:none;transition:transform .35s ease,box-shadow .35s ease;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:between;}
.cc:hover{transform:translatey(-8px);box-shadow:0 28px 65px rgba(59,31,14,.14);}
.cc-preorder-tag{position:absolute;top:.8rem;left:.8rem;z-index:2;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;background:var(--gold);color:var(--ink);font-weight:700;padding:.25rem .6rem;display:flex;align-items:center;gap:.35rem;}
.cc-preorder-tag::before{content:'';width:5px;height:5px;background:var(--ink);border-radius:50%;animation:pulse 1.8s ease-in-out infinite;}
.cc-img{height:230px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.cc-img::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3csvg width='24' height='24' viewbox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3e%3cg fill='none' stroke='rgba(255,255,255,0.15)' stroke-width='.9'%3e%3cellipse cx='6' cy='6' rx='4' ry='2.4'/%3e%3cellipse cx='18' cy='6' rx='4' ry
