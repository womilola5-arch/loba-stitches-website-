  <style>
    /* === Your Original Styles (unchanged) === */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --brown:    #3C2F2F;
      --brown2:   #5a3a2a;
      --caramel:  #c47c3e;

    /* === NEW: Rotating Knitted Background === */
    .knit-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 420px;
      height: 580px;
      transform: translate(-50%, -50%) rotateX(12deg);
      animation: knitRotate 65s linear infinite;
      z-index: 1;
      opacity: 0.12;
      pointer-events: none;
    }
    @keyframes knitRotate {
      from { transform: translate(-50%, -50%) rotateX(12deg) rotateY(0deg); }
      to   { transform: translate(-50%, -50%) rotateX(12deg) rotateY(360deg); }
    }
    .knit-bg:hover { animation-play-state: paused; }

    /* Your original styles continue below... */
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--off);
      color: var(--text);
      overflow-x: hidden;
    }

<!-- ADMIN MODAL -->
<div id="adminModal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center">
  <div class="bg-[#2C211B] rounded-3xl p-8 max-w-md w-full mx-4">
    <h3 class="text-2xl font-bold mb-6 text-center text-[#f5e6d3]">Admin - New Product</h3>
    
    <input type="password" id="adminPass" placeholder="Enter Admin Password" 
           class="w-full bg-[#3C2F2F] border border-white/30 rounded-2xl px-5 py-4 mb-6 text-white">

    <div id="uploadForm" class="hidden space-y-5">
      <input type="text" id="prodName" placeholder="Product Name" class="w-full bg-[#3C2F2F] border border-white/20 rounded-2xl px-5 py-4 text-white">
      <select id="category" class="w-full bg-[#3C2F2F] border border-white/20 rounded-2xl px-5 py-4 text-white">

        <option>Shorts</option>
        <option>Bikini/Beachwear</option>
        <option>Scrunchies</option>
        <option>Cardigan</option>
      </select>
      <button onclick="submitProduct()" class="w-full bg-[#f5e6d3] text-[#3C2F2F] py-5 rounded-2xl font-semibold">
        Submit Product
      </button>
    </div>

    <button onclick="hideAdmin()" class="mt-6 w-full text-white/70 hover:text-white">Close</button>
  </div>
</div>

<script>
  // Your original scripts here...

  // === ADMIN SCRIPT ===
  const ADMIN_PASSWORD = "LobaSt!tch3s2026#Admin";

  function showAdmin() {
    document.getElementById('adminModal').classList.remove('hidden');
    document.getElementById('adminPass').focus();
  }

  function hideAdmin() {
    document.getElementById('adminModal').classList.add('hidden');
    document.getElementById('adminPass').value = '';
    document.getElementById('uploadForm').classList.add('hidden');
  }

  document.getElementById('adminPass').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      if (this.value === ADMIN_PASSWORD) {
        document.getElementById('uploadForm').classList.remove('hidden');
      } else {
        alert("Incorrect Password");
        this.value = '';
      }
    }
  });

  function submitProduct() {
    const name = document.getElementById('prodName').value;
    if (!name) return alert("Product name is required");
    
    alert(`✅ "${name}" has been submitted successfully!\n\n(You can later connect this to WhatsApp or Airtable)`);
    hideAdmin();
  }
</script>
